services:
  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000


# Base file: backend + frontend only. Ollama comes from OLLAMA_HOST in .env.
#
# Native Ollama (Mac / any host running the Ollama app):
#   set OLLAMA_HOST=http://host.docker.internal:11434 in .env, then:
#   docker compose up -d --build
#
# Containerized Ollama with NVIDIA GPU (this machine):
#   set OLLAMA_HOST=http://ollama:11434 in .env, then:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build