## Overlay that runs Ollama as a container with NVIDIA GPU support.
## Use ONLY on a machine with an NVIDIA GPU + Docker Desktop WSL2 backend.
## Requires OLLAMA_HOST=http://ollama:11434 in .env.
##
##   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d --build
##
## First run only, pull the model into the persistent volume:
##   docker exec -it ollama-gpu ollama pull llama3.1:8b

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-gpu
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    depends_on:
      - ollama

volumes:
  ollama_data: